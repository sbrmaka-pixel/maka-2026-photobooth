<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4b1f6f" />
  <title>MAKA 2026 Digital Photobooth</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="eyebrow">SEKOLAH RENDAH SETIABUDI</div>
      <h1>MAKA 2026<br><span>Digital Photobooth</span></h1>
      <p>Capture your memorable moment ✨</p>
    </header>

    <section class="card controls-card">
      <div class="control-group">
        <label>1. Choose format</label>
        <div class="segmented">
          <button class="segment active" data-format="portrait">Portrait</button>
          <button class="segment" data-format="landscape">Landscape</button>
        </div>
      </div>

      <div class="control-group">
        <label>2. Add photo</label>
        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
        <button id="choosePhotoBtn" class="primary-btn">Open Camera / Gallery</button>
      </div>

      <div class="control-group">
        <label>3. Adjust photo</label>
        <div class="slider-row">
          <span>−</span>
          <input id="zoomRange" type="range" min="1" max="3" value="1" step="0.01" />
          <span>+</span>
        </div>
        <p class="hint">Drag the photo inside the frame to reposition it.</p>
      </div>
    </section>

    <section class="preview-wrap">
      <canvas id="photoCanvas" width="1080" height="1350"></canvas>
      <div id="emptyState" class="empty-state">Add a photo to begin</div>
    </section>

    <section class="actions">
      <button id="resetBtn" class="ghost-btn">Reset</button>
      <button id="downloadBtn" class="primary-btn" disabled>Download Photo</button>
    </section>

    <footer>
      <p>Nurturing Future KHALIFAH · #setiabudiunggul</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
