<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKA 2026 Digital Photobooth</title><link rel="stylesheet" href="style.css?v=2"><link rel="manifest" href="manifest.json"></head><body><main><header><h1>MAKA 2026</h1><h2>Digital Photobooth</h2><p>Capture your memorable moment ✨</p></header><section><label for="theme">1. Choose theme</label><select id="theme"><option value="royal">Royal Purple</option><option value="silver">Silver Lilac</option></select><label for="format">2. Choose format</label><select id="format"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select><label>3. Add photo</label><div class="buttons"><button id="camera">Open Camera</button><button id="gallery">Gallery</button><input id="file" type="file" accept="image/*" hidden></div><div class="buttons"><button id="flip" disabled>Switch Camera</button><button id="capture" disabled>Capture (3s)</button></div><label for="zoom">4. Adjust photo</label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"><small>Drag the photo to reposition it.</small></section><div class="preview"><canvas id="canvas" width="1080" height="1350"></canvas><span id="count"></span></div><video id="video" playsinline muted hidden></video><p id="status" role="status" aria-live="polite"></p><div class="buttons"><button id="retake" disabled>Retake</button><button id="download" disabled>Download Photo</button></div><footer>Nurturing Future KHALIFAH · #setiabudiunggul</footer></main><script src="app.js?v=2" defer></script></body></html>
